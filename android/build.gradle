description = 'react-native-pdf'

buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

repositories {
    mavenCentral()  // Replace jcenter() with this
   google()  // Add this line
  flatDir {
        dirs '../../../android/app/libs'
         }
}

apply plugin: 'com.android.library'

def _ext = rootProject.ext

def _reactNativeVersion = _ext.has('reactNative') ? _ext.reactNative : '+'
def _compileSdkVersion = _ext.has('compileSdkVersion') ? _ext.compileSdkVersion : 35
def _buildToolsVersion = _ext.has('buildToolsVersion') ? _ext.buildToolsVersion : '35.0.0'
def _minSdkVersion = _ext.has('minSdkVersion') ? _ext.minSdkVersion : 24
def _targetSdkVersion = _ext.has('targetSdkVersion') ? _ext.targetSdkVersion : 35

android {
    namespace "org.wonday.pdf"
    compileSdkVersion _compileSdkVersion
    buildToolsVersion _buildToolsVersion

    defaultConfig {
        minSdkVersion _minSdkVersion
        targetSdkVersion _targetSdkVersion
    }

    lintOptions {
        abortOnError true
    }

    packagingOptions {
       pickFirst 'lib/x86/libc++_shared.so'
       pickFirst 'lib/x86_64/libjsc.so'
       pickFirst 'lib/arm64-v8a/libjsc.so'
       pickFirst 'lib/arm64-v8a/libc++_shared.so'
       pickFirst 'lib/x86_64/libc++_shared.so'
       pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }
}

dependencies {
    implementation "com.facebook.react:react-native:${_reactNativeVersion}"
    implementation(name: 'android-pdf-viewer-3.1.0-beta.1', ext: 'aar')
    implementation 'io.legere:pdfiumandroid:1.0.33'
    implementation 'com.google.code.gson:gson:2.13.2'
}
